tapio {
  actor {
    serializers {
      tapio-containers = "io.github.espen7.tapio.remote.serialization.MessageContainerSerializer"
      tapio-misc = "io.github.espen7.tapio.remote.serialization.MiscMessageSerializer"
      proto = "io.github.espen7.tapio.remote.serialization.ProtobufSerializer"
      daemon-create = "io.github.espen7.tapio.remote.serialization.DaemonMsgCreateSerializer"
      tapio-system-msg = "io.github.espen7.tapio.remote.serialization.SystemMessageSerializer"
    }

    serialization-bindings {
      "io.github.espen7.tapio.actor.ActorSelectionMessage" = tapio-containers
      "io.github.espen7.tapio.remote.DaemonMsgCreate" = daemon-create
      "com.google.protobuf.GeneratedMessage" = proto
      "io.github.espen7.tapio.actor.Identify" = tapio-misc
      "io.github.espen7.tapio.actor.ActorIdentity" = tapio-misc
      "java.util.Optional" = tapio-misc
      "io.github.espen7.tapio.actor.Status$Success" = tapio-misc
      "io.github.espen7.tapio.actor.Status$Failure" = tapio-misc
      "io.github.espen7.tapio.actor.ActorRef" = tapio-misc
      "io.github.espen7.tapio.actor.PoisonPill" = tapio-misc
      "io.github.espen7.tapio.actor.Kill" = tapio-misc
      "io.github.espen7.tapio.remote.RemoteWatcher$Heartbeat" = tapio-misc
      "io.github.espen7.tapio.remote.RemoteWatcher$HeartbeatRsp" = tapio-misc
      "io.github.espen7.tapio.Done" = tapio-misc
      "io.github.espen7.tapio.actor.Address" = tapio-misc
      "io.github.espen7.tapio.remote.UniqueAddress" = tapio-misc
      "io.github.espen7.tapio.actor.ActorInitializationException" = tapio-misc
      "io.github.espen7.tapio.actor.ActorKilledException" = tapio-misc
      "io.github.espen7.tapio.actor.LocalScope" = tapio-misc
      "io.github.espen7.tapio.remote.RemoteScope" = tapio-misc
      "java.util.concurrent.TimeoutException" = tapio-misc
      "io.github.espen7.tapio.dispatch.sysmsg.SystemMessage" = tapio-system-msg
    }

    serialization-identifiers {
      "io.github.espen7.tapio.remote.serialization.ProtobufSerializer" = 2
      "io.github.espen7.tapio.remote.serialization.DaemonMsgCreateSerializer" = 3
      "io.github.espen7.tapio.remote.serialization.MessageContainerSerializer" = 6
      "io.github.espen7.tapio.remote.serialization.MiscMessageSerializer" = 16
      "io.github.espen7.tapio.remote.serialization.SystemMessageSerializer" = 22
    }
  }

  remote {
    protocol-name = "tapio"
    accept-protocol-names = ["tapio"]
    warn-about-direct-use = on
    use-unsafe-remote-features-outside-cluster = off
    warn-unsafe-watch-outside-cluster = on

    watch-failure-detector {
      implementation-class = "io.github.espen7.tapio.remote.PhiAccrualFailureDetector"
      heartbeat-interval = 1 s
      threshold = 10.0
      max-sample-size = 200
      min-std-deviation = 100 ms
      acceptable-heartbeat-pause = 10 s
      unreachable-nodes-reaper-interval = 1 s
      expected-response-after = 1 s
    }

    default-remote-dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 2
        parallelism-max = 2
      }
    }

    classic {
      enabled-transports = ["tapio.remote.classic.netty.tcp"]
      manager-name-prefix = "tapioprotocolmanager"
      use-dispatcher = "tapio.remote.default-remote-dispatcher"

      transport-failure-detector {
        implementation-class = "io.github.espen7.tapio.remote.DeadlineFailureDetector"
        heartbeat-interval = 4 s
        acceptable-heartbeat-pause = 120 s
      }

      startup-timeout = 10 s
      shutdown-timeout = 10 s
      flush-wait-on-shutdown = 2 s
      use-passive-connections = on
      passive-connection-buffer-size = 128
      backoff-interval = 5 ms
      command-ack-timeout = 30 s
      handshake-timeout = 15 s
      retry-gate-closed-for = 5 s

      untrusted-mode = off
      trusted-selection-paths = []

      log-received-messages = off
      log-sent-messages = off
      log-remote-lifecycle-events = on
      log-frame-size-exceeding = off
      log-buffer-size-exceeding = 50000

      system-message-ack-piggyback-timeout = 0.3 s
      resend-interval = 2 s
      resend-limit = 200
      system-message-buffer-size = 20000
      initial-system-message-delivery-timeout = 3 m
      quarantine-after-silence = 2 d
      prune-quarantine-marker-after = 5 d

      netty.tcp {
        transport-class = "io.github.espen7.tapio.remote.transport.netty.NettyTransport"
        applied-adapters = []
        port = 7355
        hostname = ""
        bind-port = ""
        bind-hostname = ""
        enable-ssl = false
        connection-timeout = 15 s
        use-dispatcher-for-io = ""
        write-buffer-high-water-mark = 0b
        write-buffer-low-water-mark = 0b
        send-buffer-size = 256000b
        receive-buffer-size = 256000b
        maximum-frame-size = 128000b
        backlog = 4096
        tcp-nodelay = on
        tcp-keepalive = on
        tcp-reuse-addr = off-for-windows
        server-socket-worker-pool {
          pool-size-min = 2
          pool-size-factor = 1.0
          pool-size-max = 2
        }
        client-socket-worker-pool {
          pool-size-min = 2
          pool-size-factor = 1.0
          pool-size-max = 2
        }
      }
    }
  }
}
