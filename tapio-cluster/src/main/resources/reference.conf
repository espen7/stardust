tapio {
  actor {
    serializers {
      tapio-cluster = "io.github.espen7.tapio.cluster.protobuf.ClusterMessageSerializer"
    }

    serialization-bindings {
      "io.github.espen7.tapio.cluster.ClusterMessage" = tapio-cluster
    }

    serialization-identifiers {
      "io.github.espen7.tapio.cluster.protobuf.ClusterMessageSerializer" = 5
    }
  }

  cluster {
    seed-nodes = []
    seed-node-timeout = 5s
    retry-unsuccessful-join-after = 10s
    shutdown-after-unsuccessful-join-seed-nodes = off
    roles = []
    app-version = "0.1.0"
    min-nr-of-members = 1
    role = {}
    multi-data-center {
      self-data-center = "default"
    }

    gossip-interval = 1s
    gossip-time-to-live = 2s
    leader-actions-interval = 1s
    unreachable-nodes-reaper-interval = 1s
    publish-stats-interval = off
    use-dispatcher = "tapio.cluster.default-cluster-dispatcher"
    gossip-different-view-probability = 0.8
    reduce-gossip-different-view-probability = 400
    allow-weakly-up-members = 7s
    prune-gossip-tombstones-after = 24h
    down-removal-margin = off
    quarantine-removed-node-after = 5s
    run-coordinated-shutdown-when-down = on

    downing-provider-class = ""

    failure-detector {
      implementation-class = "io.github.espen7.tapio.remote.PhiAccrualFailureDetector"
      heartbeat-interval = 1 s
      threshold = 8.0
      max-sample-size = 1000
      min-std-deviation = 100 ms
      acceptable-heartbeat-pause = 3 s
      monitored-by-nr-of-members = 9
      expected-response-after = 1 s
    }

    split-brain-resolver {
      active-strategy = "keep-majority"
      stable-after = 20s
      down-all-when-unstable = on
      keep-majority {
        role = ""
      }
      static-quorum {
        quorum-size = undefined
        role = ""
      }
      keep-oldest {
        down-if-alone = on
        role = ""
      }
      lease-majority {
        lease-implementation = ""
        acquire-lease-delay-for-minority = 2s
        role = ""
      }
    }

    default-cluster-dispatcher {
      type = "Dispatcher"
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 2
        parallelism-max = 4
      }
    }
  }
}
