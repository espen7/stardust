tapio {
  actor {
    serializers {
      tapio-singleton = "io.github.espen7.tapio.cluster.singleton.protobuf.ClusterSingletonMessageSerializer"
    }
    serialization-bindings {
      "io.github.espen7.tapio.cluster.singleton.ClusterSingletonMessage" = tapio-singleton
    }
    serialization-identifiers {
      "io.github.espen7.tapio.cluster.singleton.protobuf.ClusterSingletonMessageSerializer" = 14
    }
  }

  cluster {
  singleton {
    singleton-name = "singleton"
    role = ""
    hand-over-retry-interval = 1s
    min-number-of-hand-over-retries = 15
    use-lease = ""
    lease-retry-interval = 5s
  }

  singleton-proxy {
    singleton-name = ${tapio.cluster.singleton.singleton-name}
    role = ""
    singleton-identification-interval = 1s
    buffer-size = 1000
  }
  }
}
