pekko {
  actor {
    loglevel = "INFO"
    debug {
      receive = off
      autoreceive = off
      lifecycle = off
      unhandled = off
    }
    default-dispatcher {
      throughput = 5
    }
    scheduler {
      tick-duration = 10ms
      ticks-per-wheel = 512
      shutdown-timeout = 5s
    }
  }
}
