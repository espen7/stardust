pekko {
  daemonic = off
  log-dead-letters = 10
  log-dead-letters-during-shutdown = off
  log-dead-letters-suspend-duration = 5 minutes
  actor {
    loglevel = "INFO"
    debug {
      receive = off
      autoreceive = off
      lifecycle = off
      unhandled = off
    }
    default-dispatcher {
      throughput = 5
    }
  }
  scheduler {
    tick-duration = 10ms
    error-on-tick-duration-verification-failed = on
    ticks-per-wheel = 512
    implementation = io.github.espen7.stardust.actor.LightArrayRevolverScheduler
    shutdown-timeout = 5s
  }
  coordinated-shutdown {
    default-phase-timeout = 5s
    terminate-actor-system = on
    close-actor-system-timeout = 60s
    exit-jvm = off
    exit-code = 0
    run-by-jvm-shutdown-hook = on
    run-by-actor-system-terminate = on
    phases {
      before-service-unbind {
      }
      service-unbind {
        depends-on = [before-service-unbind]
      }
      service-requests-done {
        depends-on = [service-unbind]
      }
      service-stop {
        depends-on = [service-requests-done]
      }
      before-cluster-shutdown {
        depends-on = [service-stop]
      }
      cluster-sharding-shutdown-region {
        timeout = 10s
        depends-on = [before-cluster-shutdown]
      }
      cluster-leave {
        depends-on = [cluster-sharding-shutdown-region]
      }
      cluster-exiting {
        timeout = 10s
        depends-on = [cluster-leave]
      }
      cluster-exiting-done {
        depends-on = [cluster-exiting]
      }
      cluster-shutdown {
        depends-on = [cluster-exiting-done]
      }
      before-actor-system-terminate {
        depends-on = [cluster-shutdown]
      }
      actor-system-terminate {
        timeout = 10s
        depends-on = [before-actor-system-terminate]
      }
    }
  }
}
