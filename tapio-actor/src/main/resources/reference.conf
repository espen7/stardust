tapio {
  daemonic = off
  loglevel = ${tapio.actor.loglevel}
  log-dead-letters = 10
  log-dead-letters-during-shutdown = off
  log-dead-letters-suspend-duration = 5 minutes
  actor {
    loglevel = "INFO"
    unstarted-push-timeout = 10s
    debug {
      receive = off
      autoreceive = off
      lifecycle = off
      unhandled = off
    }
    default-dispatcher {
      type = "Dispatcher"
      throughput = 5
      throughput-deadline-time = 0ms
      shutdown-timeout = 1s

      # If this dispatcher requires a specific type of mailbox, specify the
      # fully-qualified class name here; the actually created mailbox will
      # be a subtype of this type. The empty string signifies no requirement.
      mailbox-requirement = ""
    }
    default-mailbox {
      # FQCN of the MailboxType. The Class of the FQCN must have a public
      # constructor with (ActorSystem.Settings, com.typesafe.config.Config) parameters.
      mailbox-type = "io.github.espen7.tapio.dispatch.UnboundedMailbox"

      # If the mailbox is bounded then it uses this setting to determine its
      # capacity. The provided value must be positive.
      mailbox-capacity = 1000

      # If the mailbox is bounded then this is the timeout for enqueueing
      # in case the mailbox is full. Negative values signify infinite
      # timeout, which should be avoided as it bears the risk of dead-lock.
      mailbox-push-timeout-time = 10s
    }
    mailbox {
      # Mapping between message queue semantics and mailbox configurations.
      # Used by io.github.espen7.tapio.dispatch.RequiresMessageQueue[T] to enforce
      # different mailbox types on actors.
      requirements {
        "io.github.espen7.tapio.dispatch.UnboundedMessageQueueSemantics" =
          tapio.actor.mailbox.unbounded-queue-based
        "io.github.espen7.tapio.dispatch.BoundedMessageQueueSemantics" =
          tapio.actor.mailbox.bounded-queue-based
      }

      unbounded-queue-based {
        mailbox-type = "io.github.espen7.tapio.dispatch.UnboundedMailbox"
      }

      bounded-queue-based {
        mailbox-type = "io.github.espen7.tapio.dispatch.BoundedMailbox"
      }
    }
    deployment {
      default {
        # The id of the dispatcher to use for this actor.
        # If undefined or empty the dispatcher specified in code
        # (Props.withDispatcher) is used, or default-dispatcher if not
        # specified at all.
        dispatcher = ""

        # The id of the mailbox to use for this actor.
        # If undefined or empty the default mailbox of the configured dispatcher
        # is used or if there is no mailbox configuration the mailbox specified
        # in code (Props.withMailbox) is used.
        # If there is a mailbox defined in the configured dispatcher then that
        # overrides this setting.
        mailbox = ""
      }
    }
  }
  scheduler {
    tick-duration = 10ms
    error-on-tick-duration-verification-failed = on
    ticks-per-wheel = 512
    implementation = io.github.espen7.tapio.actor.LightArrayRevolverScheduler
    shutdown-timeout = 5s
  }
  coordinated-shutdown {
    default-phase-timeout = 5s
    terminate-actor-system = on
    close-actor-system-timeout = 60s
    exit-jvm = off
    exit-code = 0
    run-by-jvm-shutdown-hook = on
    run-by-actor-system-terminate = on
    phases {
      before-service-unbind {
      }
      service-unbind {
        depends-on = [before-service-unbind]
      }
      service-requests-done {
        depends-on = [service-unbind]
      }
      service-stop {
        depends-on = [service-requests-done]
      }
      before-cluster-shutdown {
        depends-on = [service-stop]
      }
      cluster-sharding-shutdown-region {
        timeout = 10s
        depends-on = [before-cluster-shutdown]
      }
      cluster-leave {
        depends-on = [cluster-sharding-shutdown-region]
      }
      cluster-exiting {
        timeout = 10s
        depends-on = [cluster-leave]
      }
      cluster-exiting-done {
        depends-on = [cluster-exiting]
      }
      cluster-shutdown {
        depends-on = [cluster-exiting-done]
      }
      before-actor-system-terminate {
        depends-on = [cluster-shutdown]
      }
      actor-system-terminate {
        timeout = 10s
        depends-on = [before-actor-system-terminate]
      }
    }
  }
}
