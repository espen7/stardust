tapio {
  actor {
    serializers {
      tapio-sharding = "io.github.espen7.tapio.cluster.sharding.protobuf.ClusterShardingMessageSerializer"
    }
    serialization-bindings {
      "io.github.espen7.tapio.cluster.sharding.ClusterShardingSerializable" = tapio-sharding
      "io.github.espen7.tapio.cluster.sharding.ShardCoordinator$State" = tapio-sharding
    }
    serialization-identifiers {
      "io.github.espen7.tapio.cluster.sharding.protobuf.ClusterShardingMessageSerializer" = 13
    }
  }

  cluster.sharding {
    guardian-name = sharding
    role = ""
    remember-entities = off
    remember-entities-store = "ddata"
    coordinator-failure-backoff = 5 s
    retry-interval = 2 s
    buffer-size = 100000
    handoff-timeout = 60 s
    shard-start-timeout = 10 s
    shard-failure-backoff = 10 s
    entity-restart-backoff = 10 s
    rebalance-interval = 10 s
    state-store-mode = "ddata"
    waiting-for-state-timeout = 2 s
    updating-state-timeout = 5 s
    passivate-idle-entity-after = 120 s
    use-lease = ""
    lease-retry-interval = 5s
    coordinator-singleton = ${tapio.cluster.singleton}

    coordinator-state {
      write-majority-plus = 5
      read-majority-plus = 5
    }

    least-shard-allocation-strategy {
      rebalance-threshold = 1
      max-simultaneous-rebalance = 3
      rebalance-absolute-limit = 0
      rebalance-relative-limit = 0.1
    }

    distributed-data = ${tapio.cluster.distributed-data} {
      majority-min-cap = 5
      durable {
        keys = []
      }
    }
  }
}
