tapio {
  actor {
    serializers {
      tapio-ddata = "io.github.espen7.tapio.cluster.ddata.protobuf.ReplicatorMessageSerializer"
    }

    serialization-bindings {
      "io.github.espen7.tapio.cluster.ddata.ReplicatorMessage" = tapio-ddata
      "io.github.espen7.tapio.cluster.ddata.ReplicatedData" = tapio-ddata
    }

    serialization-identifiers {
      "io.github.espen7.tapio.cluster.ddata.protobuf.ReplicatorMessageSerializer" = 11
    }
  }

  cluster.distributed-data {
    name = "ddataReplicator"
    role = ""
    gossip-interval = 2s
    notify-subscribers-interval = 500ms
    max-delta-elements = 500
    use-dispatcher = ""
    pruning-interval = 120s
    max-pruning-dissemination = 300s
    pruning-marker-time-to-live = 6h
    serializer-cache-time-to-live = 10s
  }
}
